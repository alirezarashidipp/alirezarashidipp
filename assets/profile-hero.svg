<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Ali Reza Rashidi — Senior Data Scientist and GenAI Architect</title>
  <desc id="desc">A modern dark banner showing Ali Reza Rashidi's name beside a connected AI systems diagram.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.52" stop-color="#0B1024"/>
      <stop offset="1" stop-color="#111133"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94A3B8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .flow {
        stroke-dasharray: 7 10;
        animation: flow 9s linear infinite;
      }
      .pulse {
        transform-box: fill-box;
        transform-origin: center;
        animation: pulse 4s ease-in-out infinite;
      }
      @keyframes flow {
        to { stroke-dashoffset: -170; }
      }
      @keyframes pulse {
        0%, 100% { opacity: .72; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.08); }
      }
    </style>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#background)"/>
  <rect width="1200" height="380" rx="24" fill="url(#grid)"/>
  <circle cx="150" cy="25" r="225" fill="url(#cyanGlow)"/>
  <circle cx="1100" cy="340" r="260" fill="url(#violetGlow)"/>

  <g opacity="0.55">
    <circle cx="44" cy="330" r="2" fill="#22D3EE"/>
    <circle cx="535" cy="54" r="2" fill="#C084FC"/>
    <circle cx="640" cy="326" r="1.5" fill="#818CF8"/>
    <circle cx="1145" cy="50" r="2" fill="#22D3EE"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="56" y="48" width="300" height="34" rx="17" fill="#0F172A" fill-opacity="0.72" stroke="#22D3EE" stroke-opacity="0.42"/>
    <circle cx="76" cy="65" r="4" fill="#22D3EE" filter="url(#softGlow)"/>
    <text x="90" y="70" fill="#CBD5E1" font-size="12" font-weight="600" letter-spacing="1.6">BUILD • EVALUATE • GOVERN • SCALE</text>

    <text x="56" y="155" fill="#F8FAFC" font-size="58" font-weight="750" letter-spacing="-2.2">
      Ali Reza <tspan fill="url(#accent)">Rashidi</tspan>
    </text>
    <text x="58" y="204" fill="#CBD5E1" font-size="22" font-weight="600" letter-spacing="0.35">Senior Data Scientist  /  GenAI Architect</text>
    <rect x="58" y="229" width="78" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="58" y="273" fill="#94A3B8" font-size="17.5" font-weight="450">From business signal to production-grade intelligence.</text>
    <text x="58" y="311" fill="#64748B" font-size="13" font-weight="600" letter-spacing="1.3">AI SYSTEMS  ·  MODEL RISK  ·  EVALUATION  ·  MLOPS</text>
  </g>

  <g stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.46" fill="none">
    <path class="flow" d="M 960 92 C 960 118, 968 128, 980 146"/>
    <path class="flow" d="M 1082 145 C 1052 154, 1042 163, 1030 174"/>
    <path class="flow" d="M 1084 286 C 1050 258, 1036 238, 1024 220"/>
    <path class="flow" d="M 930 312 C 944 276, 958 245, 972 220"/>
    <path class="flow" d="M 846 204 C 886 204, 917 202, 946 199"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g>
      <rect x="944" y="145" width="124" height="76" rx="20" fill="#0F172A" fill-opacity="0.9" stroke="url(#accent)" stroke-width="2"/>
      <rect x="956" y="157" width="100" height="52" rx="14" fill="#111827" stroke="#FFFFFF" stroke-opacity="0.07"/>
      <text x="1006" y="181" text-anchor="middle" fill="#F8FAFC" font-size="16" font-weight="750" letter-spacing="1">AI SYSTEMS</text>
      <text x="1006" y="198" text-anchor="middle" fill="#22D3EE" font-size="9.5" font-weight="650" letter-spacing="1.4">MEASURABLE</text>
    </g>

    <g class="pulse" style="animation-delay: -.4s">
      <circle cx="960" cy="75" r="28" fill="#0F172A" stroke="#22D3EE" stroke-opacity="0.76"/>
      <circle cx="960" cy="75" r="4" fill="#22D3EE"/>
      <text x="960" y="116" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="700" letter-spacing="1.4">DATA</text>
    </g>

    <g class="pulse" style="animation-delay: -1.1s">
      <circle cx="1110" cy="135" r="28" fill="#0F172A" stroke="#818CF8" stroke-opacity="0.78"/>
      <path d="M1101 135h18M1110 126v18" stroke="#818CF8" stroke-width="2" stroke-linecap="round"/>
      <text x="1110" y="176" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="700" letter-spacing="1.2">AGENTS</text>
    </g>

    <g class="pulse" style="animation-delay: -1.8s">
      <circle cx="1110" cy="300" r="28" fill="#0F172A" stroke="#C084FC" stroke-opacity="0.8"/>
      <path d="M1101 300l6 6 13-14" fill="none" stroke="#C084FC" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1110" y="341" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="700" letter-spacing="1.2">PRODUCTION</text>
    </g>

    <g class="pulse" style="animation-delay: -2.5s">
      <circle cx="920" cy="315" r="28" fill="#0F172A" stroke="#A78BFA" stroke-opacity="0.82"/>
      <path d="M920 303l11 5v8c0 7-5 12-11 15-6-3-11-8-11-15v-8z" fill="none" stroke="#A78BFA" stroke-width="1.8"/>
      <text x="920" y="356" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="700" letter-spacing="1.3">TRUST</text>
    </g>

    <g class="pulse" style="animation-delay: -3.2s">
      <circle cx="822" cy="204" r="28" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.8"/>
      <path d="M810 204h5l4-8 7 17 4-9h5" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="822" y="245" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="700" letter-spacing="1.3">EVALS</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="378" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
</svg>
